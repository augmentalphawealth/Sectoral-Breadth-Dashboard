name: basic-industry-dashboard-eod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-shared-price-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sectoral dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Download shared price archive temporarily
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/augmentalphawealth/Situational-Awareness/contents/nse_6yr_historical.parquet?ref=main" \
            -o /tmp/nse_6yr_historical.parquet

          ls -lh /tmp/nse_6yr_historical.parquet

      - name: Show shared parquet schema
        run: |
          python - <<'PY'
          import pandas as pd

          file_path = "/tmp/nse_6yr_historical.parquet"
          df = pd.read_parquet(file_path)

          print("Rows:", len(df))
          print("Columns:", df.columns.tolist())
          print()
          print("First 3 rows:")
          print(df.head(3).to_string(index=False))
          PY
