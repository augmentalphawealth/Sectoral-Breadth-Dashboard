name: basic-industry-dashboard-eod

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1-5'

jobs:
  build-eod-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run EOD pipeline
        run: |
          python scripts/03_run_eod_pipeline.py
      - name: Upload processed outputs
        uses: actions/upload-artifact@v4
        with:
          name: basic-industry-dashboard-eod
          path: data/processed/*
