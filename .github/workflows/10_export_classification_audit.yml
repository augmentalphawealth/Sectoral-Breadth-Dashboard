name: 10 Export Classification Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export classification audit
        run: |
          python scripts/10_export_classification_audit.py

      - name: Commit audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/nse_classification_summary.csv \
            data/processed/nse_classification_review.csv

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Update classification audit"
            git push
          fi

      - name: Upload audit files
        uses: actions/upload-artifact@v4
        with:
          name: classification-audit
          path: |
            data/processed/nse_classification_summary.csv
            data/processed/nse_classification_review.csv
