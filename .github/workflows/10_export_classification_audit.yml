name: 10 Export Classification Audit

on:
  workflow_dispatch:
  schedule:
    # 13:15 UTC = 6:45 PM IST, Monday to Friday.
    - cron: "15 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: classification-audit
  cancel-in-progress: false

jobs:
  export-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export classification coverage and review audit
        run: |
          set -euo pipefail
          python scripts/10_export_classification_audit.py

      - name: Validate audit files
        run: |
          set -euo pipefail
          test -s data/processed/nse_classification_summary.csv
          test -f data/processed/nse_classification_review.csv

          python - <<'PY'
          import pandas as pd

          summary = pd.read_csv(
              "data/processed/nse_classification_summary.csv",
              dtype=str,
          ).fillna("")
          review = pd.read_csv(
              "data/processed/nse_classification_review.csv",
              dtype=str,
          ).fillna("")

          required_summary = ["generated_at_utc", "report_type"]
          summary_missing = [column for column in required_summary if column not in summary.columns]
          if summary_missing:
              raise ValueError(f"Classification summary missing columns: {summary_missing}")

          if not review.empty:
              required_review = ["symbol", "isin", "classification_status"]
              review_missing = [column for column in required_review if column not in review.columns]
              if review_missing:
                  raise ValueError(f"Classification review missing columns: {review_missing}")

          print("========== CLASSIFICATION AUDIT VALIDATION PASSED ==========")
          print(f"Summary rows: {len(summary):,}")
          print(f"Incomplete hierarchy records in review: {len(review):,}")
          PY

      - name: Commit audit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/nse_classification_summary.csv \
            data/processed/nse_classification_review.csv

          if git diff --cached --quiet; then
            echo "No classification-audit changes to commit."
          else
            git commit -m "Update classification coverage audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload classification audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-coverage-audit
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/processed/nse_classification_summary.csv
            data/processed/nse_classification_review.csv
