name: NSE Mainboard Master Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-nse-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Download and build legacy NSE master
        run: |
          python scripts/05_download_nse_master.py

      - name: Commit legacy master file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/nse_mainboard_master.parquet

          if git diff --cached --quiet; then
            echo "No legacy master changes to commit."
          else
            git commit -m "Update legacy NSE mainboard master"
            git push
          fi
