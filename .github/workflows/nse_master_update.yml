name: NSE Mainboard Master Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1-5"

permissions:
  contents: write

jobs:
  download-nse-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Download and build NSE master
        run: |
          python scripts/05_download_nse_master.py

      - name: Commit updated master file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/nse_mainboard_master.parquet
          git diff --cached --quiet || git commit -m "Update NSE mainboard master"
          git push
