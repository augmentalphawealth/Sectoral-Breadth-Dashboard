name: basic-industry-dashboard-intraday

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5,7,9,11,13 * * 1-5'

jobs:
  refresh-intraday-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run intraday refresh
        run: |
          python scripts/04_run_intraday_refresh.py
      - name: Upload processed outputs
        uses: actions/upload-artifact@v4
        with:
          name: basic-industry-dashboard-intraday
          path: data/processed/*
