name: 06 Fetch BSE Industry Mapping

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bse-industry-classification
  cancel-in-progress: false

jobs:
  fetch-bse-industry-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch BSE classifications with checkpoints
        run: |
          python scripts/06_fetch_bse_industry_mapping.py

      - name: Commit completed classifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/nse_mainboard_master_bse_classified.parquet \
            data/processed/nse_bse_industry_mapping.csv

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update BSE industry classifications"
            git push
          fi

      - name: Upload classification outputs
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-classification-output
          path: |
            data/processed/nse_mainboard_master_bse_classified.parquet
            data/processed/nse_bse_industry_mapping.csv
