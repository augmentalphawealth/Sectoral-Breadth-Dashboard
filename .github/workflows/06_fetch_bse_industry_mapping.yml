name: 06 Fetch BSE Industry Mapping

on:
  workflow_dispatch:
  schedule:
    # 12:35 UTC = 6:05 PM IST, Monday to Friday.
    - cron: "35 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bse-industry-classification
  cancel-in-progress: false

jobs:
  fetch-bse-classifications:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run primary BSE classification batch
        run: |
          set -euo pipefail
          python scripts/06_fetch_bse_industry_mapping.py

      - name: Validate BSE classification outputs
        run: |
          set -euo pipefail
          test -s data/processed/nse_mainboard_master_bse_classified.parquet
          test -f data/processed/nse_bse_industry_mapping.csv

          python - <<'PY'
          import pandas as pd

          master = pd.read_parquet(
              "data/processed/nse_mainboard_master_bse_classified.parquet"
          )
          required = [
              "symbol",
              "isin",
              "sector",
              "industry",
              "basic_industry",
              "classification_status",
          ]
          missing = [column for column in required if column not in master.columns]
          if missing:
              raise ValueError(f"Classified master missing required columns: {missing}")
          if master.empty:
              raise ValueError("Classified master is empty")

          complete = (
              master["sector"].fillna("").astype(str).str.strip().ne("")
              & master["industry"].fillna("").astype(str).str.strip().ne("")
              & master["basic_industry"].fillna("").astype(str).str.strip().ne("")
          )
          print("========== BSE CLASSIFICATION VALIDATION PASSED ==========")
          print(f"Master rows: {len(master):,}")
          print(f"Complete classifications: {int(complete.sum()):,}")
          print(f"Incomplete/retryable: {int((~complete).sum()):,}")
          PY

      - name: Commit BSE classification updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/nse_mainboard_master_bse_classified.parquet \
            data/processed/nse_bse_industry_mapping.csv

          if git diff --cached --quiet; then
            echo "No BSE classification changes to commit."
          else
            git commit -m "Update BSE industry classifications"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload BSE classification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-primary-classification
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/processed/nse_mainboard_master_bse_classified.parquet
            data/processed/nse_bse_industry_mapping.csv
