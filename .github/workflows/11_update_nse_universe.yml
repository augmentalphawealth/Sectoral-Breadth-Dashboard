name: 11 Update NSE Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update NSE universe
        run: |
          python scripts/11_update_nse_universe.py

      - name: Commit updated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/nse_mainboard_master_bse_classified.parquet

          if git diff --cached --quiet; then
            echo "No universe changes to commit."
          else
            git commit -m "Update NSE mainboard universe"
            git push
          fi

      - name: Upload updated master
        uses: actions/upload-artifact@v4
        with:
          name: nse-universe-update
          path: data/processed/nse_mainboard_master_bse_classified.parquet
