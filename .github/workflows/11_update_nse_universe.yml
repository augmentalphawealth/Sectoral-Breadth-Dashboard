name: 11 Update NSE Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "50 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-universe-update
  cancel-in-progress: false

jobs:
  update-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update classified NSE universe
        run: |
          python scripts/11_update_nse_universe.py

      - name: Commit classified master changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/nse_mainboard_master_bse_classified.parquet

          if git diff --cached --quiet; then
            echo "No classified universe changes to commit."
          else
            git commit -m "Update classified NSE mainboard universe"
            git push
          fi

      - name: Upload updated master
        uses: actions/upload-artifact@v4
        with:
          name: classified-nse-universe
          path: data/processed/nse_mainboard_master_bse_classified.parquet
