name: 07 Export BSE Unmapped Securities

on:
  workflow_dispatch:
  schedule:
    # 12:40 UTC = 6:10 PM IST, Monday to Friday.
    - cron: "40 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bse-unmapped-report
  cancel-in-progress: false

jobs:
  export-unmapped:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export incomplete and retryable classifications
        run: |
          set -euo pipefail
          python scripts/07_export_bse_unmapped.py

      - name: Validate exception report
        run: |
          set -euo pipefail
          test -f data/processed/nse_bse_unmapped.csv

          python - <<'PY'
          import pandas as pd

          path = "data/processed/nse_bse_unmapped.csv"
          report = pd.read_csv(path, dtype=str).fillna("")
          required = ["symbol", "isin", "classification_status"]
          missing = [column for column in required if column not in report.columns]
          if missing:
              raise ValueError(f"Exception report missing columns: {missing}")
          if not report.empty and report["isin"].astype(str).str.strip().eq("").any():
              raise ValueError("Exception report contains a blank ISIN")
          print("========== BSE EXCEPTION REPORT VALIDATION PASSED ==========")
          print(f"Retryable incomplete records: {len(report):,}")
          PY

      - name: Commit exception report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/nse_bse_unmapped.csv

          if git diff --cached --quiet; then
            echo "No BSE exception-report changes to commit."
          else
            git commit -m "Update BSE classification exception report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload exception report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-classification-exceptions
          retention-days: 14
          if-no-files-found: warn
          path: data/processed/nse_bse_unmapped.csv
