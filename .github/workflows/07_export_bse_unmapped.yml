name: 07 Export BSE Unmapped Securities

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-unmapped:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export unmapped securities
        run: |
          python scripts/07_export_bse_unmapped.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/nse_bse_unmapped.csv

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update BSE unmapped securities report"
            git push
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-unmapped
          path: data/processed/nse_bse_unmapped.csv
