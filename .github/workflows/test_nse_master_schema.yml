name: Test NSE Mainboard Master Schema

on:
  workflow_dispatch:

jobs:
  inspect-nse-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inspect master schema
        run: |
          python scripts/test_nse_master_schema.py
