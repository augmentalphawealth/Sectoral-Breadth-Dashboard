name: Intraday Industry Breadth Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 3-10 * * 1-5'

permissions:
  contents: write

jobs:
  update-intraday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests smartapi-python pyotp pyarrow fastparquet logzero websocket-client

      - name: Run Intraday Industry Engine
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}
        run: |
          python intraday_updater.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-update: Live Intraday Industry Breadth"
          git pull origin main --rebase -X ours || true
          git push origin main
